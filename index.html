<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/lighthousekey_icon@2x.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lighthouse Key: World of Horror Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="preload" href="/fonts/Silver.ttf">
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('theme'));
        if (typeof saved === 'string') {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) {
        // storage unavailable or invalid data: do nothing, CSS fallback applies
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
